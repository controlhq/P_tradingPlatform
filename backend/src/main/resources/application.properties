spring.application.name=tradingPlatform

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/trading}
spring.datasource.username=${DB_USERNAME:trading}
spring.datasource.password=${DB_PASSWORD:trading}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
