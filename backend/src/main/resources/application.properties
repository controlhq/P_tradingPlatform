spring.application.name=tradingPlatform

# Load variables from .env (repo root). Works when started from the repo root or from backend/.
# Real OS environment variables take precedence over values from .env.
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# HS256 key, min 32 bytes
app.jwt.secret=${JWT_SECRET:}
app.jwt.access-token-ttl=15m
app.jwt.refresh-token-ttl=7d

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Market simulator. Hours are local time in market.zone; days are a comma-separated DayOfWeek list.
market.open-time=${MARKET_OPEN_TIME:09:00}
market.close-time=${MARKET_CLOSE_TIME:17:00}
market.zone=Europe/Warsaw
market.trading-days=MONDAY,TUESDAY,WEDNESDAY,THURSDAY,FRIDAY
market.always-open=${MARKET_ALWAYS_OPEN:false}
market.tick-interval-ms=${MARKET_TICK_INTERVAL_MS:3000}
market.volatility=${MARKET_VOLATILITY:0.005}
# false disables the scheduled price generation (tests turn it off)
market.simulator-enabled=${MARKET_SIMULATOR_ENABLED:true}
