# Loaded in addition to src/main/resources/application.properties (classpath:/config/ has higher precedence).
app.jwt.secret=test-only-secret-0123456789-abcdefghij
# no scheduled jobs (price ticks, retention) during tests
market.simulator-enabled=false
market.retention-enabled=false
# orders need an open market regardless of when the tests run; tests that need it closed stub MarketHoursService
market.always-open=true
