<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Tło główne (ciemny granat/czerń) -->
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#131f2e" />
      <stop offset="60%" stop-color="#0a1017" />
      <stop offset="100%" stop-color="#05080c" />
    </radialGradient>

    <!-- Poświata za wykresem -->
    <radialGradient id="chart-aura" cx="65%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#e11d48" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#0a1017" stop-opacity="0" />
    </radialGradient>

    <!-- Filtr rozmycia dla poświat i centralnego boxa -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="heavy-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" />
    </filter>

    <!-- Gradient dla linii trendu -->
    <linearGradient id="trend-line-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.1" />
      <stop offset="40%" stop-color="#f97316" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#fb7185" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8" />
    </linearGradient>

    <!-- Wzór subtelnej siatki w tle -->
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.03" />
    </pattern>
  </defs>

  <!-- 1. Baza i siatka -->
  <rect width="1920" height="1080" fill="url(#bg-glow)" />
  <rect width="1920" height="1080" fill="url(#grid)" />
  <rect width="1920" height="1080" fill="url(#chart-aura)" />

  <!-- 2. Słupki wolumenu w tle (lewa i prawa strona) -->
  <g fill="#64748b" opacity="0.18">
    <!-- Lewa strona -->
    <rect x="380" y="340" width="4" height="50" />
    <rect x="392" y="320" width="4" height="70" />
    <rect x="404" y="355" width="4" height="35" />
    <rect x="416" y="310" width="4" height="80" />
    <rect x="428" y="335" width="4" height="55" />
    <rect x="440" y="360" width="4" height="30" />
    <rect x="464" y="330" width="4" height="60" />
    <rect x="476" y="345" width="4" height="45" />
    <rect x="740" y="290" width="5" height="60" />
    <rect x="752" y="275" width="5" height="75" />
    <rect x="764" y="305" width="5" height="45" />
    <rect x="776" y="280" width="5" height="70" />
    <!-- Prawa strona -->
    <rect x="1480" y="720" width="5" height="65" />
    <rect x="1494" y="700" width="5" height="85" />
    <rect x="1508" y="730" width="5" height="55" />
    <rect x="1522" y="690" width="5" height="95" />
    <rect x="1536" y="715" width="5" height="70" />
    <rect x="1550" y="740" width="5" height="45" />
    <rect x="1564" y="680" width="5" height="105" />
  </g>

  <!-- 3. Wykres świecowy (Candlesticks) -->
  <g stroke-width="1.5">
    <!-- Świece po lewej stronie -->
    <line x1="450" y1="680" x2="450" y2="790" stroke="#94a3b8" opacity="0.4" />
    <rect x="444" y="705" width="12" height="55" fill="#94a3b8" opacity="0.35" rx="1" />

    <line x1="485" y1="650" x2="485" y2="760" stroke="#f97316" opacity="0.45" />
    <rect x="479" y="675" width="12" height="50" fill="#f97316" opacity="0.4" rx="1" />

    <line x1="520" y1="620" x2="520" y2="730" stroke="#cbd5e1" opacity="0.5" />
    <rect x="514" y="640" width="12" height="65" fill="#cbd5e1" opacity="0.45" rx="1" />

    <line x1="555" y1="640" x2="555" y2="750" stroke="#f97316" opacity="0.5" />
    <rect x="549" y="660" width="12" height="55" fill="#f97316" opacity="0.45" rx="1" />

    <line x1="590" y1="580" x2="590" y2="710" stroke="#e2e8f0" opacity="0.65" />
    <rect x="584" y="605" width="12" height="75" fill="#e2e8f0" opacity="0.6" rx="1" />

    <line x1="625" y1="550" x2="625" y2="690" stroke="#38bdf8" opacity="0.6" />
    <rect x="619" y="575" width="12" height="80" fill="#38bdf8" opacity="0.55" rx="1" />

    <line x1="660" y1="570" x2="660" y2="670" stroke="#cbd5e1" opacity="0.55" />
    <rect x="654" y="590" width="12" height="50" fill="#cbd5e1" opacity="0.5" rx="1" />

    <!-- Świece po prawej stronie -->
    <line x1="1260" y1="450" x2="1260" y2="580" stroke="#38bdf8" opacity="0.6" />
    <rect x="1254" y="475" width="12" height="70" fill="#38bdf8" opacity="0.55" rx="1" />

    <line x1="1295" y1="420" x2="1295" y2="560" stroke="#e2e8f0" opacity="0.7" />
    <rect x="1289" y="440" width="12" height="85" fill="#e2e8f0" opacity="0.65" rx="1" />

    <line x1="1330" y1="460" x2="1330" y2="610" stroke="#f97316" opacity="0.65" />
    <rect x="1324" y="485" width="12" height="90" fill="#f97316" opacity="0.6" rx="1" />

    <line x1="1365" y1="480" x2="1365" y2="620" stroke="#fb7185" opacity="0.6" />
    <rect x="1359" y="505" width="12" height="75" fill="#fb7185" opacity="0.55" rx="1" />

    <line x1="1400" y1="410" x2="1400" y2="550" stroke="#e2e8f0" opacity="0.75" />
    <rect x="1394" y="435" width="12" height="80" fill="#e2e8f0" opacity="0.7" rx="1" />

    <line x1="1435" y1="370" x2="1435" y2="510" stroke="#38bdf8" opacity="0.7" />
    <rect x="1429" y="395" width="12" height="75" fill="#38bdf8" opacity="0.65" rx="1" />

    <line x1="1470" y1="390" x2="1470" y2="520" stroke="#cbd5e1" opacity="0.55" />
    <rect x="1464" y="415" width="12" height="65" fill="#cbd5e1" opacity="0.5" rx="1" />
  </g>

  <!-- 4. Siatka połączeń (Geometryczna konstelacja) -->
  <g stroke="#bae6fd" stroke-width="1" opacity="0.28">
    <!-- Połączenia lewa strona -->
    <line x1="160" y1="880" x2="310" y2="680" />
    <line x1="310" y1="680" x2="460" y2="750" />
    <line x1="310" y1="680" x2="420" y2="520" />
    <line x1="420" y1="520" x2="620" y2="410" />
    <line x1="420" y1="520" x2="540" y2="630" />
    <line x1="460" y1="750" x2="540" y2="630" />
    <line x1="460" y1="750" x2="640" y2="820" />
    <line x1="540" y1="630" x2="620" y2="410" />
    <line x1="540" y1="630" x2="730" y2="660" />
    <line x1="620" y1="410" x2="730" y2="660" />
    <line x1="620" y1="410" x2="930" y2="270" />
    <line x1="640" y1="820" x2="730" y2="660" />
    <line x1="640" y1="820" x2="880" y2="870" />

    <!-- Połączenia góra i prawa strona -->
    <line x1="930" y1="270" x2="1070" y2="330" />
    <line x1="930" y1="270" x2="1240" y2="290" />
    <line x1="1070" y1="330" x2="1240" y2="290" />
    <line x1="1240" y1="290" x2="1380" y2="230" />
    <line x1="1240" y1="290" x2="1340" y2="450" />
    <line x1="1380" y1="230" x2="1520" y2="380" />
    <line x1="1380" y1="230" x2="1340" y2="450" />
    <line x1="1340" y1="450" x2="1520" y2="380" />
    <line x1="1340" y1="450" x2="1440" y2="620" />
    <line x1="1520" y1="380" x2="1740" y2="280" />
    <line x1="1520" y1="380" x2="1650" y2="540" />
    <line x1="1440" y1="620" x2="1650" y2="540" />
    <line x1="1440" y1="620" x2="1230" y2="680" />
    <line x1="1650" y1="540" x2="1880" y2="420" />
  </g>

  <!-- 5. Główna linia wykresu (Pomarańczowo-czerwona linia trendu) -->
  <polyline fill="none" stroke="url(#trend-line-grad)" stroke-width="2.5" filter="url(#glow)" points="240,980 460,750 610,770 720,700 1240,560 1330,585 1440,620 1560,510 1680,470 1890,320" />

  <!-- 6. Centralna strefa pod formularz logowania (przyciemnione szkło / winieta) -->
  <g>
    <!-- Delikatna rozmyta poświata pod boxem -->
    <rect x="690" y="300" width="540" height="480" fill="#070c12" opacity="0.85" filter="url(#heavy-blur)" />
  </g>

  <!-- 7. Świecące węzły sieci (Nodes) -->
  <g fill="#ffffff" filter="url(#glow)">
    <circle cx="310" cy="680" r="3" opacity="0.7" />
    <circle cx="420" cy="520" r="3.5" opacity="0.8" />
    <circle cx="460" cy="750" r="3" opacity="0.7" />
    <circle cx="540" cy="630" r="4.5" opacity="0.95" />
    <circle cx="620" cy="410" r="4" opacity="0.9" />
    <circle cx="730" cy="660" r="3.5" opacity="0.85" />
    <circle cx="930" cy="270" r="3" opacity="0.7" />
    <circle cx="1240" cy="290" r="4.5" opacity="0.95" />
    <circle cx="1380" cy="230" r="3" opacity="0.75" />
    <circle cx="1340" cy="450" r="4" opacity="0.9" />
    <circle cx="1520" cy="380" r="4.5" opacity="0.95" />
    <circle cx="1440" cy="620" r="4" fill="#fb923c" opacity="0.95" />
    <circle cx="1650" cy="540" r="3.5" opacity="0.85" />
  </g>

  <!-- 8. Subtelne ikony fintech (wskaźniki i strzałki) -->
  <g stroke="#94a3b8" stroke-width="1.5" fill="none" opacity="0.45">
    <!-- Ikona wykresu na górze -->
    <circle cx="1160" cy="240" r="18" fill="#0f172a" />
    <polyline points="1151,246 1156,240 1161,243 1169,233" stroke="#38bdf8" />
    
    <!-- Ikona wykresu na dole po lewej -->
    <circle cx="685" cy="755" r="18" fill="#0f172a" />
    <polyline points="676,761 681,755 686,758 694,748" stroke="#38bdf8" />

    <!-- Podwójne strzałki (chevrons) -->
    <polyline points="1065,245 1072,250 1065,255" stroke="#38bdf8" stroke-width="2" />
    <polyline points="1073,245 1080,250 1073,255" stroke="#38bdf8" stroke-width="2" />

    <polyline points="595,515 602,520 595,525" stroke="#e2e8f0" stroke-width="2" />
    <polyline points="603,515 610,520 603,525" stroke="#e2e8f0" stroke-width="2" />
  </g>
</svg>